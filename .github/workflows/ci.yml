name: Build test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build on ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v0.2
        id: setup-ohos
        with:
          version: '5.0.0'

      - name: Setup Zig for OpenHarmony
        uses: openharmony-zig/setup-zig-ohos@v0.1.0
        id: setup-zig
        with:
          tag: '0.16.0'

      - name: Build
        run: |
          pushd examples/basic && zig build && popd
          pushd examples/init && zig build && popd
          pushd examples/allocator-custom && zig build && popd
          pushd examples/allocator-builtin && zig build && popd

  ohos-qemu-e2e:
    runs-on: ubuntu-24.04
    name: OHOS QEMU HAP E2E
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 unzip
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test QEMU runner failure checks
        run: python3 -m unittest discover -s scripts/qemu -p 'test_*.py'
      - name: Setup complete OpenHarmony 7.0 SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        id: sdk
        with:
          version: '7.0'
          components: 'native;ets;toolchains'
          mirror: true
      - name: Require API 26 SDK
        run: test "${{ steps.sdk.outputs.api-version }}" = '26'
      - name: Setup Zig for OpenHarmony
        uses: openharmony-zig/setup-zig-ohos@v0.1.0
        id: zig
        with:
          tag: '0.16.0'
      - name: Prepare HAP build and signing tools
        run: |
          npm install --global @ohos-rs/arkdown@0.0.2 --registry=https://registry.npmjs.org
          python3 scripts/qemu/prepare_signer.py --output .tmp_qemu_e2e/ci/signer
      - name: Download and boot harmony-contrib/ohos-qemu release
        run: |
          python3 scripts/qemu/boot_ohos_guest.py \
            --output .tmp_qemu_e2e/ci/ohos-guest --arch x86_64 --accel kvm \
            --hdc "${OHOS_BASE_SDK_HOME}/toolchains/hdc"
      - name: Run every OHOS HAP suite three times in QEMU
        run: |
          python3 scripts/qemu/run_matrix.py --product ohos --repeat 3 \
            --output .tmp_qemu_e2e/ci/ohos \
            --ohos-guest .tmp_qemu_e2e/ci/ohos-guest/guest.json \
            --ohos-zig "${{ steps.zig.outputs.zig-path }}/zig" \
            --ndk "${OHOS_NDK_HOME}" --sdk "${OHOS_BASE_SDK_HOME}" \
            --signer-dist .tmp_qemu_e2e/ci/signer
      - name: Stop OHOS QEMU
        if: always()
        run: python3 scripts/qemu/stop_guest.py --guest .tmp_qemu_e2e/ci/ohos-guest/guest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohos-qemu-e2e-evidence
          path: |
            .tmp_qemu_e2e/ci/ohos/**/*.json
            .tmp_qemu_e2e/ci/ohos/**/*.log
            .tmp_qemu_e2e/ci/ohos-guest/guest.json
            .tmp_qemu_e2e/ci/ohos-guest/*.log
            .tmp_qemu_e2e/ci/signer/signer.json

  node-qemu-e2e:
    runs-on: ubuntu-24.04
    name: Node.js QEMU E2E
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: pnpm install --frozen-lockfile
      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Download and verify Linux image and Node.js archive
        run: |
          mkdir -p .tmp_qemu_e2e/ci/downloads
          cd .tmp_qemu_e2e/ci/downloads
          curl -fL --retry 5 --retry-all-errors -O https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          curl -fL --retry 5 --retry-all-errors -o ubuntu-SHA256SUMS https://cloud-images.ubuntu.com/noble/current/SHA256SUMS
          awk '$2 == "*noble-server-cloudimg-amd64.img" || $2 == "noble-server-cloudimg-amd64.img"' ubuntu-SHA256SUMS > image.sha256
          test -s image.sha256
          sha256sum --check image.sha256
          curl -fL --retry 5 --retry-all-errors -O https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.xz
          curl -fL --retry 5 --retry-all-errors -O https://nodejs.org/dist/v24.14.0/SHASUMS256.txt
      - name: Boot isolated Linux QEMU and wait for cloud-init
        run: |
          python3 scripts/qemu/boot_node_guest.py \
            --image .tmp_qemu_e2e/ci/downloads/noble-server-cloudimg-amd64.img \
            --output .tmp_qemu_e2e/ci/node-guest --accel kvm
          python3 - <<'PYTHON'
          import json, subprocess, time
          from pathlib import Path
          root = Path('.tmp_qemu_e2e/ci/node-guest')
          guest = json.loads((root / 'guest.json').read_text())
          command = ['ssh', '-i', guest['key'], '-p', str(guest['sshPort']),
                     '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=5',
                     '-o', 'StrictHostKeyChecking=accept-new',
                     '-o', 'UserKnownHostsFile=' + str(root / 'known_hosts'),
                     guest['user'] + '@127.0.0.1', 'sudo cloud-init status --wait']
          deadline = time.monotonic() + 600
          with (root / 'boot.log').open('w') as log:
              while time.monotonic() < deadline:
                  try:
                      if subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=60).returncode == 0:
                          break
                  except subprocess.TimeoutExpired:
                      pass
                  time.sleep(3)
              else:
                  raise RuntimeError('Linux QEMU/cloud-init did not become ready')
          PYTHON
      - name: Run all Node.js and WASI E2E in QEMU
        run: |
          python3 scripts/qemu/run_matrix.py --product node --repeat 3 \
            --output .tmp_qemu_e2e/ci/node \
            --node-guest .tmp_qemu_e2e/ci/node-guest/guest.json \
            --node-archive .tmp_qemu_e2e/ci/downloads/node-v24.14.0-linux-x64.tar.xz \
            --node-shasums .tmp_qemu_e2e/ci/downloads/SHASUMS256.txt
      - name: Stop Linux QEMU
        if: always()
        run: python3 scripts/qemu/stop_guest.py --guest .tmp_qemu_e2e/ci/node-guest/guest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-qemu-e2e-evidence
          path: |
            .tmp_qemu_e2e/ci/node/**/*.json
            .tmp_qemu_e2e/ci/node/**/*.log
            .tmp_qemu_e2e/ci/node-guest/guest.json
            .tmp_qemu_e2e/ci/node-guest/*.log
            .tmp_qemu_e2e/ci/downloads/image.sha256
