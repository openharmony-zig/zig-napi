name: Build test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build on ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v0.2
        id: setup-ohos
        with:
          version: '5.0.0'

      - name: Setup Zig for OpenHarmony
        uses: openharmony-zig/setup-zig-ohos@v0.1.0
        id: setup-zig
        with:
          tag: '0.16.0'

      - name: Build
        run: |
          pushd examples/basic && zig build && popd
          pushd examples/init && zig build && popd
          pushd examples/allocator-custom && zig build && popd
          pushd examples/allocator-builtin && zig build && popd

  qemu-e2e:
    runs-on: [self-hosted, zig-napi-qemu]
    name: Node.js and OHOS QEMU E2E
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - run: pnpm install --frozen-lockfile
      - name: Run both products in real QEMU guests
        env:
          QEMU_E2E_ARGUMENTS: ${{ vars.QEMU_E2E_ARGUMENTS }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          arguments = json.loads(os.environ['QEMU_E2E_ARGUMENTS'])
          if not isinstance(arguments, list) or not all(isinstance(value, str) for value in arguments):
              raise ValueError('QEMU_E2E_ARGUMENTS must be a JSON array of runner paths and arguments')
          subprocess.run(['python3', 'scripts/qemu/run_matrix.py', '--output', '.tmp_qemu_e2e/ci', '--repeat', '3', *arguments], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-e2e-evidence
          path: |
            .tmp_qemu_e2e/ci/**/*.json
            .tmp_qemu_e2e/ci/**/*.log
