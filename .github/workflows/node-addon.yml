name: Node Addon Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  node-addon-tests:
    runs-on: ${{ matrix.os }}
    name: Node.js addon tests ${{ matrix.os }} node@${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ '12', '14', '16', '18', '20', '22', '24' ]
        include:
          - os: macos-latest
            node: '20'
          - os: macos-latest
            node: '22'
          - os: macos-latest
            node: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: node-${{ matrix.node }}

      - name: Verify Zig
        run: zig version

      - name: Run Zig unit tests
        run: zig build test-unit --summary all

      - name: Setup Node.js for install
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Install node-test dependencies
        run: pnpm install --filter zig-napi-node-test --frozen-lockfile

      - name: Setup Node.js for test
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build Node addon matrix
        if: runner.os != 'Windows'
        working-directory: node-test
        run: npm run build:test

      - name: Test Node addon matrix
        if: runner.os != 'Windows'
        working-directory: node-test
        run: npm run test:run

      - name: Build Windows Node addon matrix
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: node-test
        run: npm run build:test:windows

      - name: Test Windows Node addon matrix
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: node-test
        run: npm run test:run

  wasm-addon-tests:
    runs-on: ubuntu-latest
    name: Node.js wasm32-wasip1-threads tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: node-wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm Node example (threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd examples/node --target wasm32-wasip1-threads -- --summary all

      - name: Test wasm Node example (threaded)
        env:
          NAPI_RS_FORCE_WASI: 'error'
          NAPI_RS_WASI_FLAVOR: 'wasi'
        run: node examples/node/test.js

      - name: Build wasm Node example (single-threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd examples/node --target wasm32-wasip1 -- --summary all

      - name: Test wasm Node example (single-threaded)
        env:
          NAPI_RS_FORCE_WASI: 'error'
          NAPI_RS_WASI_FLAVOR: 'wasip1'
        run: node examples/node/test.js

      # Both flavors are built so every artifact and loader the suites below
      # need exists; a build only regenerates the flavor it targets.
      - name: Build wasm node-test matrix (threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd node-test --target wasm32-wasip1-threads -- --summary all

      - name: Build wasm node-test matrix (single-threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd node-test --target wasm32-wasip1 -- --summary all

      - name: Test wasm node-test matrix (threaded)
        working-directory: node-test
        env:
          NAPI_RS_FORCE_WASI: 'error'
          ZIG_NAPI_WASI_FLAVOR: 'wasi'
        run: npm run test:run

      - name: Test wasm node-test matrix (single-threaded)
        working-directory: node-test
        env:
          NAPI_RS_FORCE_WASI: 'error'
          ZIG_NAPI_WASI_FLAVOR: 'wasip1'
        run: npm run test:run

      - name: WASI ABI acceptance (both flavors)
        run: node --test --test-timeout=300000 node-test/wasm/abi.test.cjs

      # Runs every test in the CLI package's test directory: the real npm-pack
      # smoke test today, plus generated-loader unit tests as they land there.
      - name: CLI package tests (generated loaders and real npm pack)
        run: node --test packages/zig-napi/test/

      - name: Async event queue benchmark (both flavors)
        run: node node-test/wasm/queue-benchmark.cjs --flavor=both

      # The out-of-memory case needs an exhaustible heap. Building it rewrites
      # the async_audit artifact, so it runs after every suite that loads the
      # default artifact, and the small build is copied out before the default
      # one is restored.
      - name: Build and run the worker out-of-memory acceptance
        run: |
          cd node-test
          zig build -Dtarget=wasm32-wasi -Dcpu=baseline+atomics+bulk_memory+mutable_globals -Dwasi-max-memory-pages=520 --summary all
          mkdir -p ../zig-out/oom-artifacts
          cp async_audit.wasm32-wasi.wasm ../zig-out/oom-artifacts/
          zig build -Dtarget=wasm32-wasi -Dcpu=baseline+atomics+bulk_memory+mutable_globals --summary all
          cd ..
          ZIG_NAPI_WASM_OOM_ARTIFACT_ROOT="$PWD/zig-out/oom-artifacts" node --test --test-timeout=300000 node-test/wasm/abi.test.cjs

  cli-package-test:
    runs-on: ubuntu-latest
    name: Standalone npm package smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cli-pack
