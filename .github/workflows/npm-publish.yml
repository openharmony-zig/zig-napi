name: Publish Node CLI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Detect a CLI version bump or explicit publish commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          file=packages/zig-napi/package.json
          previous=$(git show "$BEFORE:$file" | jq -er .version)
          current=$(jq -er .version "$file")
          subject=$(git log -1 --format=%s)
          if [[ "$previous" != "$current" || "$subject" =~ ^chore\(npm\):\ publish(\ \(#[0-9]+\))?$ ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish zig-napi CLI
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: npm-publish

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root package
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format

      - name: Build wasm Node example
        run: node packages/zig-napi/bin/zig-napi.js build --cwd examples/node --target wasm32-wasip1-threads -- --summary all

      - name: Test wasm Node example
        env:
          NAPI_RS_FORCE_WASI: 'error'
        run: node examples/node/test.js

      - name: Build wasm node-test matrix (threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd node-test --target wasm32-wasip1-threads -- --summary all

      - name: Build wasm node-test matrix (single-threaded)
        run: node packages/zig-napi/bin/zig-napi.js build --cwd node-test --target wasm32-wasip1 -- --summary all

      - name: Test wasm node-test matrix
        working-directory: node-test
        env:
          NAPI_RS_FORCE_WASI: 'error'
        run: npm run test:run

      - name: Pack the release candidate
        working-directory: packages/zig-napi
        run: |
          filename=$(npm pack --json --pack-destination "$RUNNER_TEMP" | jq -er '.[0].filename')
          echo "ZIG_NAPI_CLI_TARBALL=$RUNNER_TEMP/$filename" >> "$GITHUB_ENV"

      - name: Install and test the release candidate
        run: pnpm run test:cli-pack

      - name: Publish to npm
        working-directory: packages/zig-napi
        run: |
          tag=$(node -p "const v = require('./package.json').version.split('+')[0]; v.includes('-') ? (v.split('-')[1].match(/^[a-z]+/i)?.[0] || 'next') : 'latest'")
          npm publish "$ZIG_NAPI_CLI_TARBALL" --ignore-scripts --provenance --access public --tag "$tag"
